<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Jannatim Maisha: Ph.D. student in Computer Science at Georgia State University">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#16123a"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f9a8d4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22d3ee"/>
      <stop offset="0.8" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="260" rx="18"/></clipPath>
    <style>
      .name { font: 700 50px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: url(#name); }
      .role { font: 500 19px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; letter-spacing: .3px; }
      .line { font: 500 19px Consolas, 'DejaVu Sans Mono', Menlo, monospace; fill: #7dd3fc; opacity: 0; }
      .l1 { animation: show 16s infinite 0s; }
      .l2 { animation: show 16s infinite 4s; }
      .l3 { animation: show 16s infinite 8s; }
      .l4 { animation: show 16s infinite 12s; }
      @keyframes show { 0% { opacity: 0; } 2% { opacity: 1; } 23% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
      .ecg { fill: none; stroke: url(#pulse); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 1100; animation: draw 3.2s linear infinite; }
      @keyframes draw { from { stroke-dashoffset: 1100; } to { stroke-dashoffset: -1100; } }
      .dot { fill: #c4b5fd; opacity: .5; animation: float 7s ease-in-out infinite; }
      .d2 { animation-duration: 9s; animation-delay: -2s; fill: #7dd3fc; }
      .d3 { animation-duration: 11s; animation-delay: -5s; fill: #f9a8d4; }
      @keyframes float { 0%, 100% { transform: translateY(0); opacity: .25; } 50% { transform: translateY(-14px); opacity: .7; } }
      .ring { fill: none; stroke: #7dd3fc; stroke-width: 1.5; opacity: 0; transform-origin: 880px 110px; animation: ping 3.2s ease-out infinite; }
      .r2 { animation-delay: 1.6s; }
      @keyframes ping { 0% { transform: scale(.2); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .l1 { opacity: 1; } }
    </style>
    <clipPath id="type"><rect x="48" y="150" width="0" height="34"><animate attributeName="width" values="0;560;560;0" keyTimes="0;0.45;0.92;1" dur="4s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <!-- drifting particles -->
    <circle class="dot" cx="620" cy="40" r="2.5"/>
    <circle class="dot d2" cx="700" cy="70" r="2"/>
    <circle class="dot d3" cx="760" cy="30" r="3"/>
    <circle class="dot" cx="960" cy="200" r="2"/>
    <circle class="dot d2" cx="560" cy="210" r="2.5"/>
    <circle class="dot d3" cx="930" cy="40" r="2"/>
    <!-- radar ping (mmWave sensing) -->
    <circle class="ring" cx="880" cy="110" r="46"/>
    <circle class="ring r2" cx="880" cy="110" r="46"/>
    <circle cx="880" cy="110" r="7" fill="#7dd3fc"/>
    <circle cx="880" cy="110" r="14" fill="none" stroke="#7dd3fc" stroke-opacity=".35"/>

    <text class="name" x="48" y="88">Jannatim Maisha</text>
    <text class="role" x="50" y="124">Ph.D. student · Computer Science · Georgia State University</text>

    <!-- typing lines -->
    <g clip-path="url(#type)">
      <text class="line l1" x="50" y="174">&gt; AI · computer vision · NLP · signal processing</text>
      <text class="line l2" x="50" y="174">&gt; contactless sensing: camera rPPG + mmWave radar</text>
      <text class="line l3" x="50" y="174">&gt; wearables, smartwatches &amp; human-centered AI</text>
      <text class="line l4" x="50" y="174">&gt; building robots that help people</text>
    </g>

    <!-- heartbeat (rPPG) line -->
    <path class="ecg" d="M0 225 H300 l12 0 8 -22 10 40 9 -52 10 48 7 -14 H560 l12 0 8 -22 10 40 9 -52 10 48 7 -14 H1000"/>
  </g>
</svg>
